name: Reach
description: >-
  Reach Power (Reach Labs) is a Y Combinator-backed (S2015) wireless power
  company building long-range wireless energy distribution networks, aiming to
  "do for power what Wi-Fi did for data." Its patented, AI-driven power-beaming
  systems use adaptive metamaterial antennas to steer electromagnetic waves and
  deliver electricity through the air to multiple devices simultaneously,
  scaling from microwatts to kilowatts across both mobile and stationary
  transmitters. Reach serves defense and intelligence, manufacturing and
  logistics, and public safety markets, powering autonomous vehicles, industrial
  robotics, sensors, and drones. Partners and customers include the U.S.
  Department of Defense, NASA, DARPA, the U.S. Army and Air Force, Aisin/Toyota,
  and Panasonic. The company is headquartered in San Francisco. As of this
  profile, Reach publishes no public developer API, SDK, or developer portal;
  this is a hardware and energy-infrastructure company rather than an API
  platform.
